[package]
name = "varianth-cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.33"
simplelog = "0.12.2"
clap = { version = "4.6.1", features = ["derive"] }
context = { version = "0.1.0", path = "../context" }
vep2table = { version = "0.1.0", path = "../vep2table"}
gene2protein = { version = "0.1.0", path = "../gene2protein"}
readinfo = { version = "0.1.0", path = "../readinfo" }
kmer = { version = "0.1.0", path = "../kmer" }

[[bin]]
name = "varianth"
path = "src/main.rs"
